name: Publish verified Guesty 2.4.10
on:
  push:
    branches: [release/verified-guesty-2.4.10]
    paths: [.github/workflows/publish-verified-2.4.10.yml]
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'SVENS0Nb/Guesty-HA-Plugin'
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: SVENS0Nb/Guesty-HA-Plugin
      TARGET: 9a89d9541739b83034ef3e70444206034969082c
    steps:
      - name: Verify exact source and successful main-branch checks
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/contents/custom_components/guesty/manifest.json?ref=$TARGET" --jq .content | base64 --decode > manifest.json
          python -c 'import json; assert json.load(open("manifest.json"))["version"] == "2.4.10"'
          gh api "repos/$REPO/actions/runs?head_sha=$TARGET&per_page=100" > runs.json
          python -c 'import json; runs=json.load(open("runs.json"))["workflow_runs"]; assert any(r["name"]=="Validate" and r["event"]=="push" and r["conclusion"]=="success" for r in runs); assert any(r["name"]=="Push on main" and r["conclusion"]=="success" for r in runs); assert all(r["status"]=="completed" and r["conclusion"] in ("success","skipped") for r in runs)'
          gh api "repos/$REPO/git/matching-refs/tags/v2.4.10" > matching-tags.json
          python -c 'import json,os; tags=[t for t in json.load(open("matching-tags.json")) if t["ref"]=="refs/tags/v2.4.10"]; assert len(tags)<=1; assert not tags or tags[0]["object"]["sha"]==os.environ["TARGET"]'
      - name: Publish exact tested commit
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view v2.4.10 --repo "$REPO" >/dev/null 2>&1; then
            gh release create v2.4.10 --repo "$REPO" --target "$TARGET" --title "v2.4.10 — Home Assistant device compatibility" --notes "Fixes both Home Assistant sensor and calendar deprecation warnings by linking listing devices through the owned hub registry ID on modern Home Assistant. The hub is registered before entity platforms load; older Home Assistant versions retain the supported legacy field. Existing device identifiers and custom names remain preserved. No PIN, reservation, provider synchronization or persistent database migration changes. Validation passed on Python 3.13 and 3.14 (558 tests, 85.16% coverage), including main-branch security checks and an isolated compatibility probe against the installed Home Assistant device interface. Production rollout remains a separate maintenance action."
          fi
          gh api "repos/$REPO/git/ref/tags/v2.4.10" --jq .object.sha | grep -Fx "$TARGET"
